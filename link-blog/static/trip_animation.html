<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>捷奧德自駕足跡</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffffee;--text:#1d1d1f;--muted:#6b6b70;--line:#e3e2de;
  --accent:#d1453b;--drive:#d1453b;--walk:#1f9d55;--pt:#2f6fd6;--chip:#efeee9;--chipOn:#1d1d1f;--chipOnText:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--panel:#1d1d20ee;--text:#f2f2f4;--muted:#9a9aa2;--line:#2c2c31;
  --accent:#ff6b5e;--drive:#ff6b5e;--walk:#3ccf7d;--pt:#5b9bff;--chip:#2a2a2f;--chipOn:#f2f2f4;--chipOnText:#141416;}}
:root[data-theme="dark"]{
  --bg:#141416;--panel:#1d1d20ee;--text:#f2f2f4;--muted:#9a9aa2;--line:#2c2c31;
  --accent:#ff6b5e;--drive:#ff6b5e;--walk:#3ccf7d;--pt:#5b9bff;--chip:#2a2a2f;--chipOn:#f2f2f4;--chipOnText:#141416;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;left:16px;top:16px;width:340px;max-width:calc(100% - 32px);
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px #0002}
h1{font-size:15px;margin:0 0 2px;font-weight:650;letter-spacing:.2px}
.sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.day{font-size:22px;font-weight:700;line-height:1.2}
.dayname{font-size:13px;color:var(--muted);margin:2px 0 8px;min-height:1.2em}
.clock{font-variant-numeric:tabular-nums;font-size:13px;display:flex;gap:8px;align-items:center}
.mode{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--chip)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:var(--chip);border-radius:10px;padding:6px 8px}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.ctrl{display:flex;gap:6px;align-items:center;margin-top:4px}
button,select{font:inherit;font-size:13px;color:var(--text);background:var(--chip);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:70px}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips button{padding:3px 7px;font-size:11.5px;border-radius:999px}
.chips button.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.toast{position:absolute;z-index:1000;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;
  box-shadow:0 6px 24px #0002;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.mk{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px #0006)}
.leaflet-container{background:var(--bg)}

.vlabel{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;box-shadow:none}
.vlabel:before{display:none}
@media (max-width:600px){
  .panel{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-width:none;padding:10px 12px}
  .day{font-size:18px}.stats{margin:6px 0}.chips{display:none}.toast{bottom:auto;top:16px}
}
</style>
</head>

const DAYNAMES={"10/01":"布拉格 · 抵達","10/02":"布拉格 · 城堡區","10/03":"泰爾奇 ➔ 維也納","10/04":"維也納",
"10/05":"瓦豪河谷 ➔ 哈爾施塔特","10/06":"湖區精華","10/07":"薩爾斯堡 Day 1","10/08":"薩爾斯堡 Day 2",
"10/09":"德國國王湖","10/10":"➔ 庫倫洛夫 (CK)","10/11":"CK ➔ 布拉格","10/12":"布拉格 · 還車","10/13":"布拉格 ➔ 桃園"};
const WD="日一二三四五六";
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLOR={drive:()=>css('--drive'),walk:()=>css('--walk'),pt:()=>css('--pt')};
const ICON={drive:"🚗",walk:"🚶",pt:"🚆"},MODEZH={drive:"開車",walk:"步行",pt:"大眾運輸"};

// ---- map ----
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([48.6,14.5],7);
L.control.zoom({position:'topright'}).addTo(map);
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const esriAttr='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community';
if(dark){
  L.tileLayer(ESRI+'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:esriAttr}).addTo(map);
  L.tileLayer(ESRI+'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(map);
}else{
  L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr}).addTo(map);
}

// ---- timeline model ----
const hav=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
  const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const segs=DATA.segs.map(s=>{
  const cum=[0];for(let i=1;i<s.p.length;i++)cum.push(cum[i-1]+hav(s.p[i-1],s.p[i]));
  const len=cum[cum.length-1]||1;
  // animation seconds at 1x: driving ~12 km/s, walking/pt slower so short trips stay visible
  const dur=0.35+(s.m==='drive'?s.km/12:s.m==='walk'?s.km*1.6:s.km/2.5);
  return {...s,cum,len,dur,t0d:new Date(s.t0),t1d:new Date(s.t1)};
});
const days=[...new Set(segs.map(s=>s.d))];
const DAYPAUSE=1.6; // seconds shown at each day's start
let timeline=[],T=0;
days.forEach(d=>{timeline.push({type:'day',d,start:T,dur:DAYPAUSE});T+=DAYPAUSE;
  segs.filter(s=>s.d===d).forEach(s=>{timeline.push({type:'seg',s,start:T,dur:s.dur});T+=s.dur});});
const TOTAL=T;

// visits as dots (hidden until reached)
const visitLayers=DATA.visits.map(v=>{
  const c=L.circleMarker(v.p,{radius:4,weight:1.5,color:'#fff',fillColor:css('--accent'),fillOpacity:1,opacity:0});
  c.options.fillOpacity=0;c.addTo(map);
  if(v.n)c.bindTooltip(v.n,{direction:'top',offset:[0,-4],className:'vlabel'});
  return {v,c,t:new Date(v.t0),shown:false};
});

// per-segment polylines (built lazily)
const lines=segs.map(s=>L.polyline([],{color:COLOR[s.m](),weight:s.m==='drive'?4:3,opacity:.95,
  dashArray:s.m==='pt'?'6 6':null,lineCap:'round'}).addTo(map));
const marker=L.marker(segs[0].p[0],{icon:L.divIcon({className:'',html:'<div class="mk">🚗</div>',iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:1000}).addTo(map);

// ---- UI ----
const $=id=>document.getElementById(id);
const chips=$('chips');
days.forEach(d=>{const b=document.createElement('button');b.textContent=d;b.onclick=()=>{seek(timeline.find(e=>e.type==='day'&&e.d===d).start+0.01);if(!playing)togglePlay()};chips.appendChild(b)});
let toastTimer;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
const fmt=d=>{const p=n=>String(n).padStart(2,'0');
  // show local time of the trip (Europe, UTC+2 in October)
  const x=new Date(d.getTime()+2*3600e3);return `${p(x.getUTCMonth()+1)}/${p(x.getUTCDate())}（${WD[x.getUTCDay()]}）${p(x.getUTCHours())}:${p(x.getUTCMinutes())}`};

let t=0,playing=false,last=null,curDay=null,curSeg=-1;
function pointAt(s,f){const target=f*s.len;let i=1;while(i<s.cum.length-1&&s.cum[i]<target)i++;
  const a=s.p[i-1],b=s.p[i],span=(s.cum[i]-s.cum[i-1])||1,k=Math.min(1,Math.max(0,(target-s.cum[i-1])/span));
  return {pt:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k],idx:i}}
function dayBounds(d){const b=L.latLngBounds([]);segs.filter(s=>s.d===d).forEach(s=>s.p.forEach(p=>b.extend(p)));return b}

function render(fromSeek){
  // which timeline entry are we in?
  let e=timeline[timeline.length-1];for(const x of timeline){if(t<x.start+x.dur){e=x;break}}
  const d=e.type==='day'?e.d:e.s.d;
  if(d!==curDay){curDay=d;$('day').textContent=d;$('dayname').textContent=DAYNAMES[d]||'';
    [...chips.children].forEach(c=>c.classList.toggle('on',c.textContent===d));
    map.flyToBounds(dayBounds(d),{padding:[60,60],duration:fromSeek?0.01:1.2,maxZoom:14});
    if(!fromSeek)toast(`${d}　${DAYNAMES[d]||''}`);}
  // draw segments
  let km={drive:0,walk:0,pt:0},nowTime=null,mode=null;
  segs.forEach((s,i)=>{
    const ent=timeline.find(x=>x.s===s);const f=Math.min(1,Math.max(0,(t-ent.start)/ent.dur));
    const past=s.d!==d;
    if(f<=0){if(lines[i].getLatLngs().length)lines[i].setLatLngs([]);return}
    km[s.m]+=s.km*f;
    if(f>=1){if(lines[i].getLatLngs().length!==s.p.length)lines[i].setLatLngs(s.p)}
    else{const {pt,idx}=pointAt(s,f);lines[i].setLatLngs(s.p.slice(0,idx).concat([pt]));
      marker.setLatLng(pt);nowTime=new Date(s.t0d.getTime()+(s.t1d-s.t0d)*f);mode=s.m;
      if(i!==curSeg){curSeg=i;marker.setIcon(L.divIcon({className:'',html:`<div class="mk">${ICON[s.m]}</div>`,iconSize:[24,24],iconAnchor:[12,12]}))}
      if(!map.getBounds().pad(-0.15).contains(pt))map.panTo(pt,{animate:true,duration:.6});}
    lines[i].setStyle({opacity:past?.35:.95});
  });
  if(!nowTime){ // between segments: show time of last finished / next segment
    const done=segs.filter((s,i)=>lines[i].getLatLngs().length===s.p.length);
    const s=done.length?done[done.length-1]:segs[0];nowTime=done.length?s.t1d:s.t0d;
    marker.setLatLng(done.length?s.p[s.p.length-1]:s.p[0]);}
  $('clock').textContent=fmt(nowTime);
  $('mode').textContent=mode?`${ICON[mode]} ${MODEZH[mode]}`:(playing?'📍 停留':'⏸ 暫停');
  $('sDrive').textContent=Math.round(km.drive);$('sWalk').textContent=km.walk.toFixed(1);$('sPt').textContent=km.pt.toFixed(1);
  // visits
  visitLayers.forEach(o=>{const show=o.t<=nowTime;if(show!==o.shown){o.shown=show;o.c.setStyle({opacity:show?1:0,fillOpacity:show?1:0});
    if(show&&!fromSeek&&o.v.n&&playing)toast(`📍 ${o.v.n}`)}});
  $('prog').value=Math.round(t/TOTAL*1000);
}
function frame(ts){if(!playing)return;if(last!=null){t+=(ts-last)/1000*+$('speed').value}last=ts;
  if(t>=TOTAL){t=TOTAL;render();togglePlay();toast('🛬 10/13 搭機返回桃園　全程結束');return}
  render();requestAnimationFrame(frame)}
function togglePlay(){playing=!playing;$('play').textContent=playing?'❚❚ 暫停':'▶ 播放';last=null;
  if(playing){if(t>=TOTAL)seek(0);requestAnimationFrame(frame)}else render()}
function seek(nt){t=Math.max(0,Math.min(TOTAL,nt));curDay=null;render(true)}
$('play').onclick=togglePlay;$('restart').onclick=()=>{seek(0);if(!playing)togglePlay()};
$('prog').oninput=e=>seek(e.target.value/1000*TOTAL);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'){e.preventDefault();togglePlay()}});
seek(0);
</script>
