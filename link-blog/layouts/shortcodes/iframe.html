<div class="iframe-container" style="margin: 24px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); border: 1px solid var(--border);">
  <iframe src="{{ .Get "src" }}" style="width: 100%; height: {{ default "560px" (.Get "height") }}; border: 0; display: block;" loading="lazy" allowfullscreen></iframe>
  {{ with .Get "caption" }}
  <div style="padding: 10px 16px; font-size: 0.9rem; color: var(--secondary); background: var(--entry); border-top: 1px solid var(--border); text-align: center;">
    {{ . }}
  </div>
  {{ end }}
</div>
